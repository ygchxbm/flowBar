<header><div><h1>FlowBar</h1><div class="legend">定稿原型 · 菜单栏指标依次切换</div></div><div class="controls"><label>外观<select id="theme"><option value="light">浅色</option><option value="dark">暗色</option></select></label><label>背景<select id="backdrop"><option value="reference">截图背景</option><option value="white">纯白</option><option value="wallpaper">彩色桌面</option><option value="gray">中性灰</option></select></label><label>倍率<select id="scale"><option value="1">1× 实际大小</option><option value="2">2× 对照</option></select></label><label>数据<select id="data"><option value="normal">正常状态</option><option value="charging">充电中</option><option value="unavailable">不可用</option></select></label><button class="restart" id="restart">重新打开 FlowBar</button></div></header>
<main class="stage reference" id="stage"><nav class="menubar" aria-label="模拟菜单栏"><div class="menu-left"><b>Finder</b><span>文件</span><span>编辑</span><span>显示</span></div><div class="menu-right"><button class="status" id="status" aria-expanded="true" aria-controls="panel">↓ 8K</button><span class="date">周四 10:24</span></div></nav><div class="status-toast" id="toast" role="status"></div>
<section class="panel" id="panel" role="dialog" aria-label="设备状态"><div class="glass"></div><svg class="outline" viewBox="0 0 276 378" aria-hidden="true"><path d="M22 16 L119 16 Q124 16 126.25 12.25 L134.5 3.5 Q138 -1.575 141.5 3.5 L149.75 12.25 Q152 16 157 16 L254 16 Q276 16 276 38 L276 356 Q276 378 254 378 L22 378 Q0 378 0 356 L0 38 Q0 16 22 16Z" fill="none" stroke="var(--edge)" stroke-width="1"/><path d="M22 17.2 H120 Q126 17 134.8 5 Q138 0 141.2 5 Q150 17 156 17.2 H254 Q274.8 17.2 274.8 38 V356 Q274.8 376.8 254 376.8 H22 Q1.2 376.8 1.2 356 V38 Q1.2 17.2 22 17.2Z" fill="none" stroke="var(--inner)" stroke-width=".5"/></svg><div class="content"><div class="heading-bar"><h2 class="heading">设备状态</h2></div><div class="card" id="metrics"></div><div class="card cycle-card" id="cycle-card"><div class="cycle-caption">菜单栏显示<span id="cycle-count"></span></div><div class="cycle-controls"><button id="cycle-prev" aria-label="上一项" class="cycle-arrow"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m10 4-4 4 4 4"/></svg></button><span class="cycle-current" id="cycle-current" aria-live="polite"></span><button id="cycle-next" aria-label="下一项" class="cycle-arrow"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m6 4 4 4-4 4"/></svg></button></div></div><div class="card row action"><span class="icon sf-5" style="color:#007aff"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor" stroke="none"/><path d="M12 5v7m-4-5a6 6 0 1 0 8 0" stroke="white"/></svg></span><span>登录时启动</span><button class="switch" id="login" role="switch" aria-label="登录时启动" aria-checked="true"></button></div><button class="card row action quit" id="quit"><span class="icon sf-6"><svg viewBox="0 0 24 24"><path d="M12 2v10M6.3 5.4a9 9 0 1 0 11.4 0" stroke-width="2"/></svg></span>退出</button></div></section><div class="note">点击菜单栏指标可展开／收起，点击空白处或按 Esc 关闭弹窗。<br>左右按钮切换菜单栏指标 · 演示数据，登录与退出仅作用于原型。</div></main><div class="footer">按实机截图与 SwiftUI 源码校准：276 px 宽、38 px 指标行（新增上传速度后高度随内容增加）、14 px 卡片圆角。图标来自本机 SF Symbols。截图背景模式采用固定色调匹配参考图；其他背景使用浏览器毛玻璃近似模拟。2× 模式居中用于对照，1× 模式模拟菜单栏弹出位置。</div>
<script>
const $=id=>document.getElementById(id);const icons=[['#6e63f5','<circle cx="12" cy="12" r="9"/><path d="M12 6v12m-4-4 4 4 4-4"/>'],['#ff3b30','<path d="M9 14V5a3 3 0 0 1 6 0v9a5 5 0 1 1-6 0Z"/><path d="M12 8v9"/><circle cx="12" cy="18" r="2" fill="currentColor" stroke="none"/>'],['#28cd41','<path d="m14 1-9 13h6l-1 9 9-14h-6Z" fill="currentColor" stroke="none"/>'],['#28cd41','<rect x="2" y="6" width="18" height="12" rx="2"/><path d="M22 10v4"/><rect x="4.5" y="8.5" width="11" height="7" rx=".5" fill="currentColor" stroke="none"/>'],['#007aff','<path d="M8 3v5m8-5v5M6 8h12v4a6 6 0 0 1-12 0Zm6 10v4"/>']];const labels=['下载速度','上传速度','电池温度','充电功率','电池电量','电源状态'];const values={normal:['↓ 8K','↑ 2K','33°C','-13W','55%','使用电池'],charging:['↓ 1.2M','↑ 128K','32°C','+18W','72%','充电中'],unavailable:['↓ --','↑ --','--','--','--','--']};
icons.splice(1,0,['#2993d5','']);const symbolClasses=['sf-0','sf-upload','sf-1','sf-2','sf-3','sf-4'];
let selectedMetric=0;
function setMetric(i){selectedMetric=(i+labels.length)%labels.length;render()}
function render(){const v=values[$('data').value];
$('metrics').innerHTML=labels.map((label,i)=>`${i?'<div class="line"></div>':''}<div class="row"><span class="icon ${symbolClasses[i]}" style="color:${icons[i][0]}"></span><span>${label}</span><span class="value">${v[i]}</span></div>`).join('');
$('status').textContent=v[selectedMetric];$('status').setAttribute('aria-label',labels[selectedMetric]+' '+v[selectedMetric]);$('status').title=labels[selectedMetric];
$('cycle-count').textContent=(selectedMetric+1)+' / '+labels.length;
$('cycle-current').innerHTML=`<span class="icon ${symbolClasses[selectedMetric]}" style="color:${icons[selectedMetric][0]}"></span><span>${labels[selectedMetric]}</span>`;
resizePanel();place()}
function resizePanel(){const h=378+(labels.length-5)*39+76;$('panel').style.height=h+'px';const outer=`M22 16 L119 16 Q124 16 126.25 12.25 L134.5 3.5 Q138 -1.575 141.5 3.5 L149.75 12.25 Q152 16 157 16 L254 16 Q276 16 276 38 L276 ${h-22} Q276 ${h} 254 ${h} L22 ${h} Q0 ${h} 0 ${h-22} L0 38 Q0 16 22 16Z`;
$('panel').querySelector('.glass').style.clipPath=`path('${outer}')`;const outline=$('panel').querySelector('.outline');outline.style.height=h+'px';outline.setAttribute('viewBox',`0 0 276 ${h}`);outline.children[0].setAttribute('d',outer);outline.children[1].setAttribute('d',`M22 17.2 H120 Q126 17 134.8 5 Q138 0 141.2 5 Q150 17 156 17.2 H254 Q274.8 17.2 274.8 38 V${h-22} Q274.8 ${h-1.2} 254 ${h-1.2} H22 Q1.2 ${h-1.2} 1.2 ${h-22} V38 Q1.2 17.2 22 17.2Z`)}
$('cycle-prev').onclick=()=>setMetric(selectedMetric-1);$('cycle-next').onclick=()=>setMetric(selectedMetric+1);
function place(){const r=$('status').getBoundingClientRect(),s=$('stage').getBoundingClientRect();const zoom=Math.min(Number($('scale').value),(s.width-24)/276);$('panel').style.setProperty('--preview-scale',zoom);$('stage').style.minHeight=(parseFloat($('panel').style.height||378)*zoom+100)+'px';$('panel').style.left=(Number($('scale').value)>1?(s.width-276*zoom)/2:Math.max(8,Math.min(r.left-s.left+r.width/2-138,s.width-284)))+'px'}
function show(open){$('panel').hidden=!open;$('status').setAttribute('aria-expanded',String(open))}
$('status').onclick=()=>show($('panel').hidden);$('stage').addEventListener('click',e=>{if(!e.target.closest('#panel,#status'))show(false)});document.addEventListener('keydown',e=>{if(e.key==='Escape'){show(false);$('status').focus()}});$('theme').onchange=()=>$('stage').classList.toggle('dark',$('theme').value==='dark');$('backdrop').onchange=()=>{$('stage').classList.remove('wallpaper','gray','reference');if($('backdrop').value!=='white')$('stage').classList.add($('backdrop').value)};$('scale').onchange=place;$('data').onchange=render;$('login').onclick=()=>{$('login').setAttribute('aria-checked',String($('login').getAttribute('aria-checked')!=='true'))};$('quit').onclick=()=>{show(false);$('status').hidden=true;$('restart').style.display='inline-block';$('toast').textContent='FlowBar 已退出（原型演示）'};$('restart').onclick=()=>{$('status').hidden=false;$('restart').style.display='none';$('toast').textContent='';place();show(true)};window.addEventListener('resize',place);render();place();
</script></body></html>
