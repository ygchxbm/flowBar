name: Release

on:
  push:
    tags:
      - '0.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-package-and-publish:
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check release version
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^0\.[0-9]+\.[0-9]+$ ]]
          APP_VERSION=$(plutil -extract CFBundleShortVersionString raw Resources/Info.plist)
          [[ "$APP_VERSION" == "$RELEASE_VERSION" ]]
          test -f "docs/releases/$RELEASE_VERSION.md"
      - name: Test
        run: swift test
      - name: Check concurrency boundaries
        run: swift build -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors
      - name: Package and verify release app
        run: |
          set -euo pipefail
          bash build.sh
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent .build/FlowBar.app dist/FlowBar.zip
          ditto -x -k dist/FlowBar.zip dist/verify
          codesign --verify --strict dist/verify/FlowBar.app
          cmp .build/FlowBar.app/Contents/MacOS/FlowBar dist/verify/FlowBar.app/Contents/MacOS/FlowBar
          lipo -archs dist/verify/FlowBar.app/Contents/MacOS/FlowBar
          (cd dist && shasum -a 256 FlowBar.zip > SHA256SUMS.txt)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_VERSION" \
            dist/FlowBar.zip dist/SHA256SUMS.txt \
            --verify-tag \
            --title "FlowBar $RELEASE_VERSION" \
            --notes-file "docs/releases/$RELEASE_VERSION.md" \
            --latest
